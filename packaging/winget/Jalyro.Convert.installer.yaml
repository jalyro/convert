# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

PackageIdentifier: Jalyro.Convert
PackageVersion: 0.9.33

MinimumOSVersion: 10.0.22621.0   # Windows 11 22H2 - IExplorerCommand in the primary menu

InstallerType: inno
Scope: user                      # Add-AppxPackage is per-user; a machine-wide
                                 # install would register the menu for one account only
InstallModes:
  - interactive
  - silent
  - silentWithProgress

UpgradeBehavior: install         # the installer unregisters the sparse package
                                 # before replacing files - see setup.iss

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/jalyro/convert/releases/download/v0.9.33/JalyroConvert-Setup-0.9.33.exe
    InstallerSha256: REPLACE_ME_WITH_SHA256

ManifestType: installer
ManifestVersion: 1.6.0
