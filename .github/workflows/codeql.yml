name: codeql

# Needs a public repository: code scanning is free there and unavailable on
# a private one without Advanced Security. This was manual-only until the
# repository went public. The weekly run catches newly added CodeQL queries
# on code that has not changed.
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # C++ is not analysed. CodeQL traces MSBuild-driven builds; this
        # project compiles the shell extension with direct cl.exe calls and
        # has no project file, so every database finalized with "detected
        # code written in C/C++ but could not process any of it" - build-mode
        # and batch nesting were both ruled out by experiment. Analysing a
        # separate .vcxproj written only for CodeQL would analyse something
        # other than what ships. The extension is two files that parse no
        # media and build under /W4 /WX /GS /guard:cf; the untrusted bytes
        # are all handled in the C# Worker, which is analysed.
        language: [ 'csharp' ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Without this the C++ database finalized with "detected code
          # written in C/C++ but could not process any of it": the build ran
          # untraced. manual is what the steps below already are - a build
          # between init and analyze - but it has to be stated.
          build-mode: manual

      - name: Build C# for CodeQL
        run: |
          dotnet build src/Host/Jalyro.Convert.Host.csproj -c Release --nologo
          dotnet build src/Worker/Jalyro.Convert.Worker.csproj -c Release --nologo

      - uses: github/codeql-action/analyze@v4
