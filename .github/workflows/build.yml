name: build

# Catches the class of bug that reached the developer three times in a single
# session: a call left behind after its declaration was deleted. A compiler
# finds that instantly; nothing else did.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the shell extension
        shell: cmd
        run: |
          call build\ci-vcvars.cmd || exit /b 1
          if not exist out mkdir out
          rc.exe /nologo /fo out\Shell.res /I src\Shell src\Shell\Shell.rc
          cl.exe /nologo /c /EHsc /W4 /WX /std:c++20 /permissive- /O2 /MT /GS /guard:cf ^
                 /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS /DNDEBUG /I src\Shell ^
                 /Fo:out\ src\Shell\ExplorerCommand.cpp src\Shell\Common.cpp
          link.exe /nologo /DLL /DEF:src\Shell\Shell.def /OUT:out\Jalyro.Convert.Shell.dll ^
                   out\ExplorerCommand.obj out\Common.obj out\Shell.res ^
                   shlwapi.lib ole32.lib oleaut32.lib shell32.lib user32.lib advapi32.lib kernel32.lib

      - name: Verify COM exports
        shell: cmd
        run: |
          call build\ci-vcvars.cmd || exit /b 1
          dumpbin /nologo /exports out\Jalyro.Convert.Shell.dll | findstr /C:"DllGetClassObject" || exit /b 1
          dumpbin /nologo /exports out\Jalyro.Convert.Shell.dll | findstr /C:"DllCanUnloadNow"   || exit /b 1

      - name: Verify no VC++ redist dependency
        shell: cmd
        run: |
          call build\ci-vcvars.cmd || exit /b 1
          dumpbin /nologo /dependents out\Jalyro.Convert.Shell.dll | findstr /C:"VCRUNTIME140" && exit /b 1
          echo No redist dependency.
          rem  echo does not reset ERRORLEVEL, so without this the step ends
          rem  carrying the 1 from the findstr that correctly found nothing.
          exit /b 0

      - name: Build the Host
        run: dotnet publish src/Host/Jalyro.Convert.Host.csproj -c Release -o out --nologo

      - name: Build the Worker
        run: dotnet publish src/Worker/Jalyro.Convert.Worker.csproj -c Release -o out-worker --nologo

      - name: Check the CLSID matches across manifest and source
        shell: pwsh
        run: |
          $rx = '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'
          $files = @('package/AppxManifest.xml','src/Shell/ExplorerCommand.cpp','src/Shell/Common.h')
          $sets = $files | ForEach-Object {
            ,(( Select-String -Path $_ -Pattern $rx -AllMatches ).Matches.Value |
              ForEach-Object { $_.ToUpper() } | Sort-Object -Unique)
          }
          if (($sets | ForEach-Object { $_ -join ',' } | Sort-Object -Unique).Count -ne 1) {
            Write-Error "CLSID mismatch across manifest and source"
          }
          Write-Host "CLSID consistent"

      - name: Fetch ffmpeg
        shell: cmd
        run: build\fetch-ffmpeg.cmd gpl

      - name: Record the ffmpeg build actually used
        shell: pwsh
        run: |
          # The fetch URL is a mutable "latest". Recording the version and hash
          # of what CI got is the minimum needed to honour the GPL source offer
          # for any artifact this run produces.
          $exe = "src/ffmpeg/ffmpeg.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          # Drain fully before selecting: Select-Object -First on a native
          # command can leave $LASTEXITCODE unset (PowerShell issue #19848),
          # and the Actions pwsh wrapper then treats the step as passed.
          $out = @(& $exe -version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe exited with code $LASTEXITCODE" }
          $ver = $out | Select-Object -First 1
          if (-not $ver) { throw "ffmpeg.exe produced no version output" }
          Write-Host "ffmpeg: $ver"
          Write-Host "sha256: $hash"
          "$ver`nsha256: $hash" | Out-File ffmpeg-provenance.txt

      - name: JPEG quality estimator
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          # Drive the REAL estimator, not a reimplementation of it.
          python tools/verify-jpeg-quality.py --worker out-worker/Jalyro.Convert.Worker.exe

      - name: Check every PowerShell script parses
        shell: pwsh
        run: |
          # A script that fails to parse is a check that silently never runs.
          # This happened: an edit orphaned an "elseif" and the CI fuzz step
          # would have failed before executing a single case.
          #
          # pscheck extracts the PowerShell embedded in .cmd caret-continued
          # strings - two 5.1-only API bugs shipped in exactly such blocks,
          # unchecked - so the real parser below sees those blocks too. Its
          # selftest runs first: an extractor silently returning empty has
          # also happened.
          python tools/pscheck.py --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ext = Join-Path $env:RUNNER_TEMP 'extracted-ps'
          python tools/pscheck.py --extract $ext 'tools/fuzz/*.ps1' 'build/*.ps1' 'build/*.cmd'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in @(Get-ChildItem tools/fuzz/*.ps1) + @(Get-ChildItem build/*.ps1) + @(Get-ChildItem $ext/*.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "PARSE ERRORS in $($f.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  $_" }
              exit 1
            }
            Write-Host "$($f.Name): parses"
          }

      - name: Filename fuzz
        shell: pwsh
        run: |
          # A source image the harness can copy.
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Bitmap]::new(64,64)
          $bmp.Save("$env:TEMP\ci-source.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          ./tools/fuzz/fuzz-filenames.ps1 `
            -WorkerPath (Resolve-Path ./out-worker/Jalyro.Convert.Worker.exe) `
            -SourceImage "$env:TEMP\ci-source.png"

      - name: Content fuzz
        shell: pwsh
        run: |
          ./tools/fuzz/fuzz-content.ps1 `
            -WorkerPath (Resolve-Path ./out-worker/Jalyro.Convert.Worker.exe) `
            -SourceImage "$env:TEMP\ci-source.png"

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            out/Jalyro.Convert.Shell.dll
            out/Jalyro.Convert.Host.exe
            out-worker/Jalyro.Convert.Worker.exe
            ffmpeg-provenance.txt
          retention-days: 7
